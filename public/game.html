<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link for google Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!---->
    <link rel="stylesheet" href="../asstets/css/reset.css">
    <link rel="stylesheet" href="../asstets/css/style.css">
    <title>Console Game</title>
</head>
<body>
    <div id="mainCon" class="main-container">
        <div id="gameCon" class="game-container">
            <div id="gameField" class="game-field">
                <canvas id="gameCanvas"></canvas>

            </div>
            
        </div>
        <div id="consField" class="console-field">
            <textarea name="console" id="consoleArea" class="console-text" spellcheck="false"></textarea>
            <div class="text-bg">   </div>
        </div> 
        <div class="tutorial" id="tutorial">
            <img class="img-1" src="../asstets/items/Scroll-handle.png" alt="">
            <div class="scroll" id="scroll">
                <img class="img-3" src="../asstets/items/Tutorial-field.png" alt="">
                <div class="scroll-text">
                    <h2>How to play</h2>
                    <p>Step 1: Type class into a console and choose. </p>
                </div>
            </div>
            <img class="img-2" src="../asstets/items/Scroll-handle.png" alt="">
        </div>
    </div> 

    <script src="../asstets/js/script.js"></script>
    <script src="../asstets/js/console.js"></script>
</body>
</html>
